<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Python Challenge 3</title>
<style>
body{font-family:"Times New Roman",serif;background:#f4f4f4;margin:0;padding:20px;color:#111}
.container{max-width:850px;margin:auto;background:#fff;padding:24px;border:1px solid #ccc;border-radius:10px}
h1,h2{text-align:center}.status{display:flex;justify-content:space-between;margin:20px 0;font-size:18px}
.progress{height:12px;background:#ddd;border-radius:8px;overflow:hidden;margin-bottom:20px}.bar{height:100%;width:0;background:#333}
.card{border:1px solid #ccc;padding:20px;border-radius:8px}.code{background:#eee;padding:12px;margin:15px 0;font-family:monospace;white-space:pre-wrap;border-radius:6px}
button{width:100%;padding:11px;margin:8px 0;font-family:"Times New Roman",serif;font-size:17px;background:#fff;border:1px solid #444;border-radius:6px;cursor:pointer}
button:hover{background:#eee}.correct{background:#e8f5e9}.wrong{background:#fdeaea}.feedback{display:none;padding:12px;margin-top:14px;border-radius:6px}
.next{display:none;background:#111;color:#fff}.final{display:none;text-align:center}
</style></head><body>
<div class="container"><h1>Python Challenge 3</h1><h2>New Values. New Challenge.</h2>
<div class="status"><div>Score: <span id="score">0</span></div><div>Question: <span id="qnum">1</span>/20</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="card"><h3 id="topic"></h3><p id="question"></p><div class="code" id="code"></div><div id="answers"></div>
<div class="feedback" id="feedback"></div><button class="next" id="nextBtn" onclick="nextQuestion()">Next Question</button></div>
<div class="final" id="final"><h2>Game Complete</h2><p>Your score is <span id="finalScore"></span> out of 200.</p><p id="message"></p><button onclick="restart()">Play Again</button></div></div>
<script>
const questions=[{"topic": "1. print()", "question": "What will this code display?", "code": "print(\"Good Morning\")", "answers": ["Good Morning", "print", "Morning Good", "Nothing"], "correct": 0, "explanation": "print() displays the text inside the quotation marks."}, {"topic": "2. Variable", "question": "What value is stored in points?", "code": "points = 25", "answers": ["25", "points", "0", "5"], "correct": 0, "explanation": "The variable points stores the number 25."}, {"topic": "3. String", "question": "Which line correctly stores the word Jordan?", "code": "", "answers": ["country = \"Jordan\"", "country = Jordan", "Jordan = country", "country == Jordan"], "correct": 0, "explanation": "Text values need quotation marks."}, {"topic": "4. input()", "question": "What does this code ask the user to enter?", "code": "food = input(\"Enter your favourite food: \")", "answers": ["A favourite food", "A number only", "A password", "Nothing"], "correct": 0, "explanation": "input() asks the user to type information."}, {"topic": "5. Addition", "question": "What is the output?", "code": "a = 8\nb = 7\nprint(a + b)", "answers": ["15", "87", "1", "56"], "correct": 0, "explanation": "8 + 7 = 15."}, {"topic": "6. Subtraction", "question": "What is the output?", "code": "x = 20\ny = 6\nprint(x - y)", "answers": ["14", "26", "120", "6"], "correct": 0, "explanation": "20 - 6 = 14."}, {"topic": "7. Multiplication", "question": "What will Python print?", "code": "x = 4\ny = 6\nprint(x * y)", "answers": ["10", "24", "46", "2"], "correct": 1, "explanation": "4 multiplied by 6 is 24."}, {"topic": "8. if statement", "question": "Will Python print High?", "code": "score = 85\nif score >= 80:\n    print(\"High\")", "answers": ["Yes", "No", "Only if score is 80", "The code has an error"], "correct": 0, "explanation": "85 is greater than or equal to 80, so the condition is True."}, {"topic": "9. Comparison", "question": "Which symbol checks whether two values are equal?", "code": "", "answers": ["==", "=", ">", "<"], "correct": 0, "explanation": "== compares two values to see whether they are equal."}, {"topic": "10. else", "question": "What will this code print?", "code": "temperature = 15\nif temperature > 25:\n    print(\"Hot\")\nelse:\n    print(\"Cool\")", "answers": ["Hot", "Cool", "15", "Nothing"], "correct": 1, "explanation": "15 is not greater than 25, so Python runs the else block."}, {"topic": "11. for loop", "question": "How many times will Python print Play?", "code": "for i in range(5):\n    print(\"Play\")", "answers": ["4", "5", "6", "1"], "correct": 1, "explanation": "The loop repeats five times."}, {"topic": "12. range()", "question": "What values will Python print?", "code": "for i in range(4):\n    print(i)", "answers": ["0, 1, 2, 3", "1, 2, 3, 4", "0, 1, 2, 3, 4", "4 only"], "correct": 0, "explanation": "range(4) gives 0, 1, 2, and 3. It stops before 4."}, {"topic": "13. Loop calculation", "question": "What will this code print?", "code": "for i in [2, 4, 6]:\n    print(i + 3)", "answers": ["5, 7, 9", "2, 4, 6", "6, 8, 10", "3, 5, 7"], "correct": 0, "explanation": "Python adds 3 to each value: 2 + 3, 4 + 3, and 6 + 3."}, {"topic": "14. Debugging", "question": "What is missing from this code?", "code": "if number > 10\n    print(\"Big\")", "answers": ["A colon :", "Quotation marks", "A variable", "An input"], "correct": 0, "explanation": "An if statement needs a colon at the end of the condition."}, {"topic": "15. Loop and condition", "question": "When will Python print Target?", "code": "for i in [1, 3, 5, 7]:\n    if i == 5:\n        print(\"Target\")", "answers": ["When i is 5", "When i is 1", "Every time", "Never"], "correct": 0, "explanation": "Target prints only when i equals 5."}, {"topic": "16. Changing a variable", "question": "What is the final value of coins?", "code": "coins = 12\ncoins = coins + 5\nprint(coins)", "answers": ["12", "5", "17", "60"], "correct": 2, "explanation": "coins starts at 12. Adding 5 gives 17."}, {"topic": "17. Predict the output", "question": "What will Python display?", "code": "total = 30\ntotal = total - 8\nprint(total)", "answers": ["38", "30", "22", "8"], "correct": 2, "explanation": "30 - 8 = 22."}, {"topic": "18. import time", "question": "Which line lets Python use the time module?", "code": "", "answers": ["import time", "time import", "print time", "time = import"], "correct": 0, "explanation": "import time loads the time module."}, {"topic": "19. time.sleep()", "question": "What does this line do?", "code": "time.sleep(3)", "answers": ["Pauses the program for 3 seconds", "Prints the number 3", "Repeats code 3 times", "Ends the program"], "correct": 0, "explanation": "time.sleep(3) pauses the program for 3 seconds."}, {"topic": "20. Final Challenge", "question": "What happens when this program runs?", "code": "import time\nprint(\"Begin\")\ntime.sleep(3)\nprint(\"Finished\")", "answers": ["Print Begin, wait 3 seconds, print Finished", "Wait first, then print both messages", "Print Begin three times", "Print Finished first"], "correct": 0, "explanation": "Python prints Begin, waits 3 seconds, then prints Finished."}];let current=0,score=0,answered=false;
function loadQuestion(){answered=false;const q=questions[current];topic.textContent=q.topic;question.textContent=q.question;code.textContent=q.code||"Choose the correct answer.";qnum.textContent=current+1;bar.style.width=(current/questions.length*100)+"%";answers.innerHTML="";q.answers.forEach((a,i)=>{const b=document.createElement("button");b.textContent=a;b.onclick=()=>checkAnswer(i);answers.appendChild(b)});feedback.style.display="none";nextBtn.style.display="none"}
function checkAnswer(i){if(answered)return;answered=true;const q=questions[current];document.querySelectorAll("#answers button").forEach((b,j)=>{if(j===q.correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong");b.disabled=true});feedback.style.display="block";if(i===q.correct){score+=10;document.getElementById("score").textContent=score;feedback.className="feedback correct";feedback.innerHTML="<b>Correct.</b><br>"+q.explanation}else{feedback.className="feedback wrong";feedback.innerHTML="<b>Not correct.</b><br>"+q.explanation}nextBtn.style.display="block"}
function nextQuestion(){current++;if(current<questions.length)loadQuestion();else{card.style.display="none";final.style.display="block";bar.style.width="100%";finalScore.textContent=score;message.textContent=score>=180?"Excellent.":score>=140?"Good work. Review the questions you missed.":score>=100?"Good start. Practise again.":"Play again and use the explanations.";}}
function restart(){current=0;score=0;document.getElementById("score").textContent=0;card.style.display="block";final.style.display="none";loadQuestion()}loadQuestion();
</script></body></html>
