<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary and Number Systems - 25 Questions</title><style>body{font-family:"Times New Roman",serif;margin:0;background:#f4f7fb;color:#172d4e}main{max-width:850px;margin:35px auto;padding:24px}.panel{background:white;border-radius:16px;padding:30px;box-shadow:0 4px 20px #152a4519}h1{margin:0 0 8px}p{line-height:1.5}.muted{color:#5d6b7c}.bar{height:12px;background:#e2e8f0;border-radius:9px;overflow:hidden}.fill{height:100%;background:#2765ad;width:0;transition:.2s}.option{display:block;width:100%;padding:14px;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:9px;margin:9px 0;font:19px "Times New Roman";cursor:pointer}.option:hover{background:#edf4ff}.option:disabled{cursor:default}.good{background:#d9f5e2!important;border-color:#21965b}.bad{background:#ffe0e0!important;border-color:#ca4848}button.primary{background:#173e76;color:white;border:0;border-radius:8px;padding:12px 24px;font:18px "Times New Roman";cursor:pointer}button:disabled{opacity:.6}.feedback{padding:15px;background:#edf4ff;border-radius:9px;margin:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0}.small{font-size:15px}a{color:#2158a2}</style></head><body><main><p><a href="index.html">← All seven games</a></p><div class="panel" id="game"><h1>2.1 Binary and Number Systems</h1><p class="muted">Grade 9 ICT Unit 2 | 25 questions | Answer feedback after each question</p><div class="nav"><span id="count"></span><span id="score"></span></div><div class="bar"><div class="fill" id="progress"></div></div><h2 id="question"></h2><div id="options"></div><div class="feedback" id="feedback" hidden></div><button class="primary" id="next" hidden>Next question</button></div></main><script>const DATA=[{"q": "Convert binary 11 to decimal.", "options": ["2", "3", "4", "5"], "answer": 1, "ex": "11 = 1 + 2 = 3."}, {"q": "Convert binary 101 to decimal.", "options": ["5", "4", "7", "6"], "answer": 0, "ex": "101 = 1 + 4 = 5."}, {"q": "Convert binary 110 to decimal.", "options": ["8", "6", "7", "5"], "answer": 1, "ex": "110 = 2 + 4 = 6."}, {"q": "Convert binary 111 to decimal.", "options": ["9", "7", "6", "8"], "answer": 1, "ex": "111 = 1 + 2 + 4 = 7."}, {"q": "Convert binary 1001 to decimal.", "options": ["10", "8", "9", "11"], "answer": 2, "ex": "1001 = 1 + 8 = 9."}, {"q": "Convert binary 1010 to decimal.", "options": ["12", "11", "10", "9"], "answer": 2, "ex": "1010 = 2 + 8 = 10."}, {"q": "Convert binary 1011 to decimal.", "options": ["12", "10", "13", "11"], "answer": 3, "ex": "1011 = 1 + 2 + 8 = 11."}, {"q": "Convert binary 1100 to decimal.", "options": ["11", "12", "13", "14"], "answer": 1, "ex": "1100 = 4 + 8 = 12."}, {"q": "Convert binary 1101 to decimal.", "options": ["15", "14", "12", "13"], "answer": 3, "ex": "1101 = 1 + 4 + 8 = 13."}, {"q": "Convert binary 1110 to decimal.", "options": ["15", "13", "14", "16"], "answer": 2, "ex": "1110 = 2 + 4 + 8 = 14."}, {"q": "Convert binary 1111 to decimal.", "options": ["16", "14", "17", "15"], "answer": 3, "ex": "1111 = 1 + 2 + 4 + 8 = 15."}, {"q": "Convert binary 10001 to decimal.", "options": ["16", "19", "17", "18"], "answer": 2, "ex": "10001 = 1 + 16 = 17."}, {"q": "Convert binary 10011 to decimal.", "options": ["20", "21", "19", "18"], "answer": 2, "ex": "10011 = 1 + 2 + 16 = 19."}, {"q": "Convert binary 10101 to decimal.", "options": ["20", "21", "23", "22"], "answer": 1, "ex": "10101 = 1 + 4 + 16 = 21."}, {"q": "Convert binary 10111 to decimal.", "options": ["25", "23", "24", "22"], "answer": 1, "ex": "10111 = 1 + 2 + 4 + 16 = 23."}, {"q": "Convert binary 11001 to decimal.", "options": ["26", "27", "24", "25"], "answer": 3, "ex": "11001 = 1 + 8 + 16 = 25."}, {"q": "Convert binary 11011 to decimal.", "options": ["26", "28", "27", "29"], "answer": 2, "ex": "11011 = 1 + 2 + 8 + 16 = 27."}, {"q": "Convert binary 11101 to decimal.", "options": ["30", "28", "29", "31"], "answer": 2, "ex": "11101 = 1 + 4 + 8 + 16 = 29."}, {"q": "Convert binary 11111 to decimal.", "options": ["32", "30", "33", "31"], "answer": 3, "ex": "11111 = 1 + 2 + 4 + 8 + 16 = 31."}, {"q": "Which digits are used in binary?", "options": ["0 to 9", "1 to 9", "0 and 1", "0 to 7"], "answer": 2, "ex": "Binary is base 2 and uses only 0 and 1."}, {"q": "What is the base of the decimal system?", "options": ["2", "16", "8", "10"], "answer": 3, "ex": "Correct answer: 10."}, {"q": "What is the base of hexadecimal?", "options": ["2", "8", "10", "16"], "answer": 3, "ex": "Correct answer: 16."}, {"q": "What is the decimal code for A in hexadecimal?", "options": ["10", "11", "12", "15"], "answer": 0, "ex": "In hexadecimal, A represents decimal 10."}, {"q": "Why do digital circuits suit binary?", "options": ["They use ten states", "They have two distinct states", "They cannot store data", "They only process letters"], "answer": 1, "ex": "Correct answer: They have two distinct states."}, {"q": "Why is hexadecimal useful?", "options": ["It uses only two symbols", "It shortens long binary sequences", "It replaces all data storage", "It stores only images"], "answer": 1, "ex": "Correct answer: It shortens long binary sequences."}];const questions=DATA;let idx=0,score=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;let q=questions[idx];el('progress').style.width=(idx/questions.length*100)+'%';el('count').textContent=`Question ${idx+1} of ${questions.length}`;el('score').textContent=`Score: ${score}`;el('question').textContent=q.q;el('options').innerHTML='';el('feedback').hidden=true;el('next').hidden=true;q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);el('options').appendChild(b)})}function choose(i){if(answered)return;answered=true;let q=questions[idx];if(i===q.answer)score++;[...el('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('good');else if(j===i)b.classList.add('bad')});el('score').textContent=`Score: ${score}`;el('feedback').hidden=false;el('feedback').textContent=(i===q.answer?'Correct. ':'Not quite. ')+q.ex;el('next').hidden=false;el('next').textContent=idx===questions.length-1?'See results':'Next question'}el('next').onclick=()=>{idx++;if(idx<questions.length)render();else finish()};function finish(){el('progress').style.width='100%';el('game').innerHTML=`<h2>Section complete</h2><p style="font-size:25px">${score} / ${questions.length} correct (${Math.round(score/questions.length*100)}%)</p><p>Review this section again to improve your result.</p><button class="primary" onclick="location.reload()">Play again</button> <p><a href="index.html">Return to all sections</a></p>`}render();</script></body></html>
